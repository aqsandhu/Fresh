# ============================================================================
# FreshBazar Docker Compose — local full-stack dev
# PostgreSQL + Redis + Backend + Website + Admin Panel
#
# Production deploys via Render (backend) + Vercel (website/admin); this file is
# only for spinning up the whole stack locally with `docker compose up`.
#
# First run:  cp .env.example .env  → set JWT_SECRET and JWT_REFRESH_SECRET
#             (two DIFFERENT values, 32+ characters), ADMIN_PHONE and
#             ADMIN_PASSWORD (the first owner login), then `docker compose up --build`.
# Database:   the empty database gets database/schema.sql on its first start;
#             the backend then applies database/migrations/*.sql itself before
#             it starts (the same runner Render uses as its pre-deploy step).
# Addresses:  API http://localhost:3000 · website http://localhost:3001 ·
#             admin http://localhost:5173
# Limits:     pictures need SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in .env
#             (without them an upload is refused with a clear message).
#             The website's live order updates (socket) connect to the API
#             address baked into its build; inside compose that is
#             http://backend:3000, which a browser cannot reach — run the
#             website with `pnpm --filter website dev` when you need them.
# ============================================================================

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: freshbazar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-freshbazar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ONLY the schema. Mounting the whole database/ folder (as before) also ran
      # 00-reset.sql and the retired rider_system_migration.sql — the latter
      # BEFORE schema.sql — so the very first start failed.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-freshbazar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freshbazar-network

  # ── Redis Cache ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: freshbazar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freshbazar-network

  # ── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      # Monorepo build: context is the repo root so the Dockerfile can reach
      # the root pnpm-lock.yaml / pnpm-workspace.yaml.
      context: .
      dockerfile: backend/Dockerfile
    container_name: freshbazar-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Apply pending migrations, then start. Without this the API ran on
    # schema.sql alone and ~29 later tables were missing (500s everywhere).
    command: ["sh", "-c", "node backend/dist/scripts/runSqlMigrations.js && node backend/dist/app.js"]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-freshbazar}
      - DB_SSL=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-freshbazar}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001,http://localhost:5173}
      - CORS_CREDENTIALS=true
      - SENTRY_DSN=${SENTRY_DSN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE=5242880
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - freshbazar-network

  # ── Website (Next.js) ───────────────────────────────────────────────────
  website:
    build:
      # Monorepo build: context is the repo root (see backend above).
      context: .
      dockerfile: website/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, not read at runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3000/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fresh Bazar}
    container_name: freshbazar-website
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://backend:3000/api
      - NEXT_PUBLIC_APP_NAME=Fresh Bazar
    depends_on:
      - backend
    networks:
      - freshbazar-network

  # ── Admin Panel ─────────────────────────────────────────────────────────
  admin-panel:
    build:
      # Monorepo build: context is the repo root (see backend above).
      context: .
      dockerfile: admin-panel/Dockerfile
      args:
        # VITE_* is inlined at build time, not read at runtime.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: freshbazar-admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://backend:3000/api
    depends_on:
      - backend
    networks:
      - freshbazar-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  freshbazar-network:
    driver: bridge
