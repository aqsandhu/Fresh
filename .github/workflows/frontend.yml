name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['admin-panel/**', 'website/**', 'customer-app/**', 'rider-app/**', 'packages/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main, develop]
    paths: ['admin-panel/**', 'website/**', 'customer-app/**', 'rider-app/**', 'packages/**']

jobs:
  test-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @freshbazar/shared-types build && pnpm --filter @freshbazar/core-auth build
      - run: pnpm --filter freshbazar-admin typecheck
      - run: pnpm --filter freshbazar-admin test
      # vite.config.ts refuses a production build without VITE_API_URL (so a
      # bundle can never silently point at localhost) — CI must supply one.
      - name: Build admin panel
        run: pnpm --filter freshbazar-admin build
        env:
          VITE_API_URL: https://api.example.invalid/api
      - uses: actions/upload-artifact@v4
        with:
          name: admin-coverage
          path: admin-panel/coverage/

  test-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @freshbazar/shared-types build && pnpm --filter @freshbazar/core-auth build
      - run: pnpm --filter freshbazar-website typecheck
      - run: pnpm --filter freshbazar-website test
      - name: Build website
        run: pnpm --filter freshbazar-website build
        env:
          # Build-time inlined by Next — must match website/vercel.json.
          NEXT_PUBLIC_API_URL: https://freshbazar-backend.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: website-coverage
          path: website/coverage/

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter @freshbazar/shared-types build && pnpm --filter @freshbazar/core-auth build
      - run: pnpm --filter @freshbazar/customer-app test
      - run: pnpm --filter @freshbazar/rider-app test

# No deploy jobs here: the website (Vercel project "freshbazar") and the admin
# panel (Vercel project "fresh-admin-panel") are deployed by Vercel's GitHub
# integration on every push to main, using website/vercel.json and
# admin-panel/vercel.json. The backend is deployed by Render (render.yaml).
